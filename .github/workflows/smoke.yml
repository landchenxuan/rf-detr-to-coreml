name: No-download Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Python no-download smoke
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run smoke checks
        env:
          RF_HOME: ${{ runner.temp }}/rfdetr-smoke-cache
        run: |
          python -m compileall -q rfdetr_coreml scripts
          python scripts/smoke_test.py
