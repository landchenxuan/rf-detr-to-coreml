[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rfdetr-coreml"
version = "1.11.2"
description = "Image inputs, graph normalization and class metadata for RF-DETR official Core ML export"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Xuan Chen" },
]
keywords = [
    "coreml",
    "rf-detr",
    "object-detection",
    "instance-segmentation",
    "apple",
    "neural-engine",
    "model-conversion",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.7.0,<2.8",
    "torchvision>=0.22.0,<0.23",
    "coremltools>=9.0,<10",
    "rfdetr[coreml]>=1.11.2,<1.12",
]

[project.scripts]
rfdetr-coreml = "rfdetr_coreml.cli:main"

[project.urls]
Homepage = "https://github.com/landchenxuan/rf-detr-to-coreml"
Repository = "https://github.com/landchenxuan/rf-detr-to-coreml"
Issues = "https://github.com/landchenxuan/rf-detr-to-coreml/issues"

[tool.setuptools.packages.find]
include = ["rfdetr_coreml*"]
